apiVersion: apps/v1
kind: Deployment
metadata:
  name: cs-campaigns-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cs-campaigns-api
  template:
    metadata:
      labels:
        app: cs-campaigns-api
    spec:
      containers:
        - name: cs-campaigns-api
          image: gabrielnatan2001/cs-campaigns-api:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: cs-campaigns-config
            - secretRef:
                name: cs-campaigns-secret
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
